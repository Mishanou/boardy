services:

  nginx:
    image: nginx:alpine
    container_name: boardy-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./boardy-laravel:/var/www
    depends_on:
      laravel:
        condition: service_started
      fastapi:
        condition: service_started
    networks:
      - boardy-network

  laravel:
    build:
      context: ./boardy-laravel
      dockerfile: Dockerfile
    container_name: boardy-laravel
    volumes:
      - ./boardy-laravel:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - boardy-network

  fastapi:
    build:
      context: ./boardy-api
      dockerfile: Dockerfile
    container_name: boardy-api
    volumes:
      - ./boardy-api:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - boardy-network

  mysql:
    image: mysql:8.4
    container_name: boardy-mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - boardy-network

  redis:
    image: redis:7-alpine
    container_name: boardy-redis
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - boardy-network

networks:
  boardy-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data: